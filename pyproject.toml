[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-hub-skeleton"
version = "0.1.0"
description = "A local, tier-ready research hub host"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "mcp[cli]<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.5"]
rag = [
  "pymupdf>=1.24",
  "pillow>=10",
  "pytesseract>=0.3.10",
  "fastembed>=0.3",
  "sqlite-vec>=0.1.3",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
hub = ["index.html"]

[tool.setuptools.packages.find]
include = ["hub*"]
