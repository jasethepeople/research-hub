<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Research Hub</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8ecf0;background:#10151b;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:980px}header{padding:24px 28px 18px;border-bottom:1px solid #27313c;background:#151d26}h1{margin:0 0 14px;font-size:22px;letter-spacing:.01em}form{display:flex;gap:10px;max-width:780px}input{flex:1;min-width:0;padding:11px 13px;border:1px solid #3b4855;border-radius:7px;background:#0e141a;color:#f4f6f8;font-size:15px}button{padding:0 18px;border:0;border-radius:7px;background:#91c8ff;color:#102033;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.meta{margin:10px 0 0;color:#9eabb8;font-size:12px}.panes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:18px 20px}.pane{min-height:300px;padding:15px;border:1px solid #2c3742;border-radius:10px;background:#151d26;overflow-wrap:anywhere}.pane h2{margin:0 0 11px;font-size:16px}.statuses{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 13px}.tierchip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:99px;background:#202a34;color:#c6d0da;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#707d89;display:inline-block}.dot.ok{background:#58d68d}.dot.degraded{background:#f4c95d}.dot.skipped,.dot.absent{background:#f07878}.dot.idle{background:#8fa5ba}.error{display:none;margin:0 0 12px;padding:9px;border-left:3px solid #f07878;background:#2b2023;color:#ffb7b7;font-size:12px}.error.visible{display:block}.result{padding:11px 0;border-top:1px solid #2c3742}.result a{color:#a8d6ff;font-weight:650;text-decoration:none}.result a:hover{text-decoration:underline}.byline{margin-top:4px;color:#9eabb8;font-size:12px}.empty{color:#82909d;font-size:13px;padding:8px 0}.also{color:#82909d;font-size:11px;margin-top:4px}.snippet{margin-top:4px;color:#b9c4cf;font-size:12px;line-height:1.45}
#tierbar{display:flex;align-items:center;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.tabbtn{padding:7px 14px;border:1px solid #3b4855;border-radius:99px;background:#0e141a;color:#c6d0da;font-size:13px;font-weight:600;cursor:pointer}
.tabbtn.active{background:#91c8ff;border-color:#91c8ff;color:#102033}
.checks{display:flex;gap:7px;flex-wrap:wrap}
label.pick{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #3b4855;border-radius:99px;background:#0e141a;color:#c6d0da;font-size:12px;cursor:pointer;user-select:none}
label.pick input{accent-color:#91c8ff;margin:0}
label.pick.on{border-color:#91c8ff;color:#e8ecf0;background:#16283a}
.mini{padding:6px 10px;border:1px solid #3b4855;border-radius:7px;background:transparent;color:#9eabb8;font-size:11px;font-weight:600;cursor:pointer}
.mini:hover{color:#e8ecf0}
</style>
</head>
<body>
<header>
<h1>Local Research Hub</h1>
<form id="search-form"><input id="query" name="query" placeholder="Search across your registered tiers" autocomplete="off" required><button id="submit" type="submit">Search</button></form>
<div id="tierbar">
  <span id="tabs" style="display:inline-flex;gap:8px"></span>
  <span id="checks" class="checks"></span>
  <button type="button" class="mini" id="allbtn">All</button>
  <button type="button" class="mini" id="nonebtn">None</button>
</div>
<p class="meta">Local-only host · check tiers to include them in the search (nothing checked = search everything).</p>
</header>
<main id="panes" class="panes"></main>
<script>
const CATEGORY_TITLES = {library: "Library", code: "Code", vulns: "Vulnerabilities", general: "General"};
const CATEGORY_ORDER = ["library", "code", "vulns", "general"];
let tierInfo = [];           // [{name, category, state}]
let checked = new Set();     // tier names included in searches
let activeTab = "library";
const panesEl = document.querySelector("#panes");

function esc(value) {
  return String(value ?? "").replace(/[&<>\"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
}
function loadChecked() {
  try { const saved = JSON.parse(localStorage.getItem("hub-tiers") || "null"); if (Array.isArray(saved)) return new Set(saved); } catch (e) {}
  return null;
}
function saveChecked() { localStorage.setItem("hub-tiers", JSON.stringify([...checked])); }
function allNames() { return tierInfo.map(t => t.name); }
function categories() {
  const present = [...new Set(tierInfo.map(t => t.category || "other"))];
  return CATEGORY_ORDER.filter(c => present.includes(c)).concat(present.filter(c => !CATEGORY_ORDER.includes(c)));
}
function renderTabsAndChecks() {
  const tabsEl = document.querySelector("#tabs");
  tabsEl.innerHTML = categories().map(cat =>
    `<button type="button" class="tabbtn ${cat === activeTab ? "active" : ""}" data-cat="${cat}">${esc(CATEGORY_TITLES[cat] || cat)}</button>`).join("");
  for (const btn of tabsEl.querySelectorAll(".tabbtn")) {
    btn.addEventListener("click", () => { activeTab = btn.dataset.cat; renderTabsAndChecks(); });
  }
  const checksEl = document.querySelector("#checks");
  checksEl.innerHTML = tierInfo.filter(t => (t.category || "other") === activeTab).map(t =>
    `<label class="pick ${checked.has(t.name) ? "on" : ""}"><input type="checkbox" data-tier="${esc(t.name)}" ${checked.has(t.name) ? "checked" : ""}>${esc(t.name)}</label>`).join("");
  for (const box of checksEl.querySelectorAll("input")) {
    box.addEventListener("change", () => {
      if (box.checked) checked.add(box.dataset.tier); else checked.delete(box.dataset.tier);
      saveChecked(); renderTabsAndChecks();
    });
  }
}
function renderPanes() {
  panesEl.style.gridTemplateColumns = `repeat(${Math.min(categories().length, 3)},minmax(0,1fr))`;
  panesEl.innerHTML = categories().map(cat =>
    `<section class="pane" data-pane="${cat}"><h2>${esc(CATEGORY_TITLES[cat] || cat)}</h2><div class="statuses"></div><div class="error"></div><div class="results"><div class="empty">Search to begin.</div></div></section>`).join("");
}
function showResults(results, notes) {
  for (const pane of panesEl.querySelectorAll(".pane")) {
    const category = pane.dataset.pane;
    const tierNames = tierInfo.filter(t => (t.category || "other") === category).map(t => t.name);
    const statuses = pane.querySelector(".statuses");
    statuses.innerHTML = tierNames.length
      ? tierNames.map(name => `<span class="tierchip"><i class="dot ${esc((notes[name] || {}).state || "absent")}"></i>${esc(name)}</span>`).join("")
      : '<span class="tierchip"><i class="dot"></i>No tier registered</span>';
    const failures = tierNames.filter(name => ["degraded","skipped","absent"].includes((notes[name] || {}).state || "absent"));
    const error = pane.querySelector(".error");
    error.textContent = failures.length
      ? failures.map(name => `${name}: ${(notes[name] || {}).note || (notes[name] || {}).state}`).join(" · ")
      : "";
    error.classList.toggle("visible", failures.length > 0);
    const items = results.filter(item => {
      const t = tierInfo.find(x => x.name === item.tier);
      return t && (t.category || "other") === category;
    });
    const resultTarget = pane.querySelector(".results");
    resultTarget.innerHTML = items.length ? items.map(item => {
      const title = esc(item.title);
      const safeUrl = /^https?:\/\//i.test(item.url || "") ? item.url : "";
      const url = esc(safeUrl);
      const author = item.author ? ` · ${esc(item.author)}` : "";
      const also = item.also_on?.length ? `<div class="also">Also on: ${item.also_on.map(esc).join(", ")}</div>` : "";
      const snippet = item.snippet ? `<div class="snippet">${esc(item.snippet)}</div>` : "";
      const link = url ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>` : title;
      return `<article class="result">${link}<div class="byline">${esc(item.tier)}${author}</div>${also}${snippet}</article>`;
    }).join("") : '<div class="empty">No results in this pane.</div>';
  }
}
document.querySelector("#search-form").addEventListener("submit", async event => {
  event.preventDefault();
  const query = document.querySelector("#query").value.trim();
  if (!query) return;
  const button = document.querySelector("#submit");
  button.disabled = true;
  button.textContent = "Searching…";
  for (const pane of panesEl.querySelectorAll(".pane")) pane.querySelector(".error").classList.remove("visible");
  const params = new URLSearchParams({query});
  const picked = [...checked];
  if (picked.length && picked.length < allNames().length) params.set("tiers", picked.join(","));
  try {
    const response = await fetch(`/api/search?${params}`, {headers:{Accept:"application/json"}});
    if (!response.ok) throw new Error(`Search failed (${response.status}).`);
    const data = await response.json();
    showResults(data.results || [], data.notes || {});
  } catch (error) {
    for (const pane of panesEl.querySelectorAll(".pane")) {
      const target = pane.querySelector(".error");
      target.textContent = error.message || "Search failed.";
      target.classList.add("visible");
    }
  } finally {
    button.disabled = false;
    button.textContent = "Search";
  }
});
document.querySelector("#allbtn").addEventListener("click", () => { checked = new Set(allNames()); saveChecked(); renderTabsAndChecks(); });
document.querySelector("#nonebtn").addEventListener("click", () => { checked = new Set(); saveChecked(); renderTabsAndChecks(); });
(async () => {
  try {
    const response = await fetch("/api/health", {headers:{Accept:"application/json"}});
    const data = await response.json();
    tierInfo = Object.entries(data.tiers || {})
      .filter(([name]) => !["tiers","cache_ttl","tier_meta"].includes(name))
      .map(([name, info]) => ({name, category: info.category || "other", state: info.state}));
  } catch (e) { tierInfo = []; }
  const saved = loadChecked();
  checked = saved ? new Set([...saved].filter(n => allNames().includes(n))) : new Set(allNames());
  if (!tierInfo.length) tierInfo = [{name: "annas", category: "library", state: "absent"}];
  renderPanes();
  renderTabsAndChecks();
})();
</script>
</body>
</html>
